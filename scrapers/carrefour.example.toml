# Requires the browser extra and Chrome/Chromium.
[[scrapers]]
adapter = "carrefour"
schedule_id = "carrefour-sp"
enabled = true
scraper_id = "muffato-curitiba-01"
shop_id = "carrefour"
shop_url = "https://mercado.carrefour.com.br"
core_url = "http://127.0.0.1:8080"
ingestion_token_env = "INGESTION_TOKEN"
city = "São Paulo"
state = "SP"
postal_code = "01310100"
region_id = "v2.4FC957AB8941A10397B85207B23C2F55"
seller_id = "1"
store_id = "region:v2.4FC957AB8941A10397B85207B23C2F55/seller:1"
timeout_seconds = 30.0
request_interval_seconds = 1.5
max_search_pages = 100
max_catalog_pages = 1000
spool_path = "data/carrefour-sp/spool.sqlite3"

